[project]
name = "henry-modulo3"
version = "1.0.0"
description = "Cuatro clases de agentes, LangChain, LangGraph y LLMOps"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "python-dotenv>=1,<2",
  "pydantic>=2.10,<3",
  "numpy>=2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=6.29,<8",
  "jupyterlab>=4,<5",
  "jupytext>=1.17,<2",
  "pandas>=3.0.6",
  "isort>=9.0.2",
  "autopep8>=2.3.2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/henry_agents"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"clases/*.py" = ["E402"]
